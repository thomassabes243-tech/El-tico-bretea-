name: MexaChamba Android Verify

on:
  push:
    branches:
      - codex/mexachamba-onboarding-payments-ready
    paths:
      - "android/**"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/mexachamba-android.yml"
  workflow_dispatch:

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Static config verification
        run: python3 android/scripts/verify-config.py

      - name: Verify Gradle wrapper and compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew lintRelease
          ./gradlew assembleDebug
