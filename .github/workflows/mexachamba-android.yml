name: MexaChamba Android Verify

on:
  push:
    branches:
      - codex/mexachamba-onboarding-payments-ready
    paths:
      - "android/**"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/mexachamba-android.yml"
  workflow_dispatch:

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static config verification
        run: python3 android/scripts/verify-config.py

      - name: Compile Android project
        working-directory: android
        run: |
          gradle --version
          gradle clean
          gradle lintRelease
          gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mexachamba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
